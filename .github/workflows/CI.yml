name: CI

on:
  push:
    branches:
      - "**" # Run on all branches
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/ai4work-project/manufacturing-scheduler

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install package and dependencies
        run: |
          python3 -m pip install .[test]
      - name: Run solver tests
        run: |
          python -m pytest -v ./tests/test_solver.py
      - name: Run validator tests
        run: |
          python -m pytest -v ./tests/test_validator.py
      - name: Run API tests
        run: |
          python server.py &
          SERVER_PID=$!
          timeout 60 bash -c 'until curl -sf http://localhost:5000/health; do sleep 1; done'
          python -m pytest -v ./tests/test_api.py
          kill $SERVER_PID
      - name: Client example test
        run: |
          python server.py &
          SERVER_PID=$!
          timeout 60 bash -c 'until curl -sf http://localhost:5000/health; do sleep 1; done'
          python examples/client_example.py
          kill $SERVER_PID
      - name: Log in to registry
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
      - name: Build and push the container image
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && IMAGE_VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,' | sed -e 's/^v//') || IMAGE_VERSION="latest"
          docker buildx build . --push --file ./Dockerfile --tag ${{ env.IMAGE_NAME }}:$IMAGE_VERSION
