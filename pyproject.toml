[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manufacturing"
version = "0.1.0"
dependencies = [
    "ortools==9.12.4544",
    "matplotlib==3.10.1",
    "plotly==6.2.0",
    "kaleido==1.0.0",
    "pandas==2.2.3",
    "dataclasses-json==0.6.7",
    "flask==3.1.0",
    "waitress==3.0.2"
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["saved_plots*"]

[project.optional-dependencies]
test = [
    "pytest",
    "requests"
]